name: Sync with upstream

# This fork carries Satelight's changes as commits on the satelight branch, which Satelight's webOS native app takes as
# a submodule. Weekly, this brings the fork's copy of upstream's branch up to date and rebases satelight onto it (main,
# not the latest release: upstream's fixes Satelight needs land there weeks before a release). Commits upstream has
# since taken become empty and are dropped. A rebase that conflicts fails this run and leaves satelight as it was.
# Satelight's own bump workflow then moves its submodule here once its build and tests pass, later on Mondays.
#
# Upstream's commits change its workflow files, which GITHUB_TOKEN may never push (`refusing to allow a GitHub App to
# create or update workflow ... without workflows permission`), so both pushes need the FORK_SYNC_TOKEN secret: a
# fine-grained token with Contents and Workflows write access to this repository. Without it the run fails at once.

on:
  schedule:
    - cron: '7 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: chiaki-ng/chiaki-ng
  UPSTREAM_BRANCH: main
  # What satelight is rebased onto: `branch` (UPSTREAM_BRANCH's head) or `release` (upstream's latest release).
  BASE: branch

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check for FORK_SYNC_TOKEN
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "::error::No FORK_SYNC_TOKEN secret: GITHUB_TOKEN can't push upstream's workflow files (see the top of this file)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: satelight
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}
      - name: Sync upstream's branch
        run: |
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet --tags upstream "$UPSTREAM_BRANCH"
          git push origin "refs/remotes/upstream/$UPSTREAM_BRANCH:refs/heads/$UPSTREAM_BRANCH"
      - name: Rebase satelight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BASE" = release ]; then
            base=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          else
            base=upstream/$UPSTREAM_BRANCH
          fi
          if git merge-base --is-ancestor "$base" HEAD; then
            echo "satelight is already on $base." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          old=$(git rev-parse HEAD)
          git rebase --empty=drop "$base"
          # Satelight's submodule may still point at the old commits until its bump passes: keep them reachable.
          git push origin "$old:refs/tags/satelight-${old:0:12}"
          git push --force-with-lease="satelight:$old" origin HEAD:satelight
          { echo "Rebased satelight onto $base:"; echo; git log --format='- %s' "$base..HEAD"; } >> "$GITHUB_STEP_SUMMARY"
